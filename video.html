<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VolgaMore</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/video/video1.css" />
  </head>

  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="topDescription" class="topDescription">
        <div class="topDescription-container">
          <img
            src="./foto/wolgaMore/header/1.webp"
            srcset="
              .\video\tumbnailForSection\1.2.webp 1024w,
              .\video\tumbnailForSection\1.webp   1500w
            "
            sizes="
    (max-width: 768px) 768px,
    (max-width: 1024px) 1024px,
    1500px"
            alt="Волга море - живописный вид"
            width="1500"
            height="600"
            fetchpriority="high"
            loading="eager"
          />

          <div class="info-box">
            <div class="text">
              <h1>Видео</h1>
            </div>
          </div>
        </div>
      </section>

      <section class="video-section">
        <div class="video-container">
          <!-- Main Video -->
          <div class="video-wrapper">
            <div class="video-player">
              <iframe
                src="https://vkvideo.ru/video_ext.php?oid=-45599639&id=456243920&hash=5bf45201eb71a515&hd=4"
                width="1920"
                height="1080"
                allow="
                  autoplay;
                  encrypted-media;
                  fullscreen;
                  picture-in-picture;
                  screen-wake-lock;
                "
                frameborder="0"
                allowfullscreen
              ></iframe>
            </div>

            <div class="video-info">
              <h1 class="video-title">
                Волга море. Пешая тропа вдоль величайшей реки Европы
              </h1>
            </div>
          </div>

          <!-- Comments Section -->
          <div class="comments-section" id="comments">
            <div class="comments-header">
              <h2 class="comments-title">
                <i class="fa-regular fa-comment"></i> Комментарии
                <span class="comments-count">(0)</span>
              </h2>
              <div class="comments-sort">
                <select class="sort-select" id="sortSelect">
                  <option value="DATE_DESC">Сначала новые</option>
                  <option value="DATE_ASC">Сначала старые</option>
                  <option value="LIKES">По популярности</option>
                </select>
              </div>
            </div>

            <!-- Add Comment Form -->
            <div class="add-comment">
              <div class="comment-avatar">
                <img
                  src="./foto/placeholder/avatar-placeholder.jpg"
                  alt="Аватар"
                />
              </div>
              <div class="comment-form-wrapper">
                <textarea
                  id="commentText"
                  class="comment-input"
                  placeholder="Напишите комментарий..."
                  rows="3"
                  maxlength="1000"
                ></textarea>
                <div class="comment-actions">
                  <button class="comment-submit" id="submitComment">
                    <i class="fa-regular fa-paper-plane"></i> Отправить
                  </button>
                  <div class="comment-char-counter">
                    <span id="charCount">0</span>/1000
                  </div>
                </div>
              </div>
            </div>

            <!-- Comments List -->
            <div class="comments-list" id="commentsList">
              <div class="no-comments">
                <i class="fa-regular fa-message"></i>
                <p>Пока нет комментариев. Будьте первым!</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div id="ranStripsPlaceholder" class="ranStrips-section"></div>

      <div class="wrapper">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <ol id="breadcrumb-list">
            <!-- JavaScript will fill this automatically -->
          </ol>
        </nav>
      </div>

      <div class="scrollUp">
        <a href="#" class="btn">Перемотка вверх</a>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="./js/script.js" defer></script>
    <script src="./js/header.js" defer></script>
    <script src="./js/footer-loader.js" defer></script>
    <script src="./js/breadcrumbs.js" defer></script>
    <script src="./js/video/video1.js" defer></script>
    <script src="./js/ranStrips-loader.js" defer></script>
  </body>
</html>

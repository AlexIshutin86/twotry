<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VolgaMore</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="header-placeholder"></div>

    <main>
      <section id="topDescription" class="topDescription">
        <div class="topDescription-container">
          <div id="hero">
            <video autoplay loop muted>
              <source
                src="./video/tumbnailForSection/firstTry_cropped.mp4"
                type="video/mp4"
              />
            </video>
          </div>

          <div class="info-box">
            <div class="text">
              <h1>Видео</h1>
            </div>
          </div>
        </div>
      </section>

      <div class="wrapper">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <ol id="breadcrumb-list">
            <!-- JavaScript will fill this automatically -->
          </ol>
        </nav>
      </div>

      <div class="scrollUp">
        <a href="#" class="btn">Перемотка вверх</a>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="./js/script.js" defer></script>
    <script src="./js/header.js" defer></script>
    <script src="./js/footer-loader.js" defer></script>
    <script src="./js/breadcrumbs.js" defer></script>
  </body>
</html>

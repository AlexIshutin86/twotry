<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VolgaMore</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/telegramPlashka.css" />
  </head>

  <body>
    <div class="wrapper">
      <div class="telegramPlashka" id="telegramPlashka">
        <div class="container-telegramPlashka">
          <div class="telegramPlashka-avatar">
            <img src="./foto/wolgaMore/vladimer.jpg" alt="Владимир Сергиенко" />
          </div>
          <i class="fa-brands fa-telegram telegram-icon"></i>
          <div class="telegramPlashka-deskr">
            <h3>Остались вопросы? <span>Напишите мне</span></h3>
            <p>Отвечу в течение 5 минут</p>
          </div>
          <button class="telegram-close" aria-label="Закрыть">×</button>
        </div>
      </div>
    </div>

    <script src="./js/script.js" defer></script>
    <script src="./js/telegramOnScroll.js"></script>
  </body>
</html>
